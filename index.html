<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PBMS — Parking Building Management System." />
    <title>PBMS Control Hub</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%232563EB'/%3E%3Cstop offset='100%25' stop-color='%2306B6D4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='36' height='36' rx='11' fill='url(%23g)'/%3E%3Crect x='13' y='10' width='5' height='20' rx='2.5' fill='%23fff'/%3E%3Cpath d='M18,10 L23,10 A5,5 0 0 1 23,20 L18,20 Z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Tải font KHÔNG chặn render: `media="print"` khiến trình duyệt hạ ưu tiên và
      không giữ lần vẽ đầu tiên lại chờ CSS này, rồi `onload` trả về `all` để áp
      dụng font. Kết hợp với `display=swap` sẵn có, chữ hiện ngay bằng font hệ
      thống thay vì đợi round-trip tới Google Fonts trên mạng chậm.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      />
    </noscript>
  </head>

  </body>
</html>
